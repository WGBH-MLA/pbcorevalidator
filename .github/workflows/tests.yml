name: 🧪 Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  tests:
    name: ⚗️ Run Tests
    runs-on: ubuntu-latest
    steps:
    - name: 📰 Checkout
      uses: actions/checkout@v7

    - name: 🏗 Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - name: 📦 Install dependencies
      run: npm ci --no-audit --no-fund

    - name: 🧪 Run tests
      run: npm test
